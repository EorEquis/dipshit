services:
  moderator:
    build: ./moderator
    container_name: dipshit-moderator
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: dipshit-ui
    depends_on:
      - moderator
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
